# ============================================================
# docker-compose.yml — PRODUCTION
# Utilisé pour l'environnement de production et le pipeline CI/CD.
# Les images sont pré-compilées et hébergées sur GHCR.
# Pour usage local, voir docker-compose.local.yml
# ============================================================

services:
  mongodb:
    build: ./listic-database          # MongoDB est toujours buildé localement (données custom)
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/houssam365/listic-backend:latest
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATA_PATH_RESEARCHERS=/app/data/listic personnes/listic_personnes.complete_structure.json
      - DATA_PATH_PROJECTS=/app/data/listic_projet/listic_projets.complete_structure.json
      - DATA_PATH_DOCTORANTS=/app/data/listic personnes/listic_personnes.doctorants.json
    volumes:
      - ./listic-database:/app/data
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    image: ghcr.io/houssam365/listic-frontend:latest
    ports:
      - "80:80"
    restart: always
    depends_on:
      - backend

volumes:
  mongo_data:
